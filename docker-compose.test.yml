services:
  db-test:
    image: postgres:15-alpine
    container_name: fastapi-db-test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: fastapi-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fastapi-app-test
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db-test:5432/app_test
      - REDIS_URL=redis://redis-test:6379/0
      - SECRET_KEY=test_secret_key
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_test
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: sh -c "uv sync --all-extras --dev && uv run pytest tests"
